name: Production Readiness

on:
  push:
    branches: [main, development, 'phase-*']
  pull_request:
    branches: [main, development]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d projectflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectflow?schema=public
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectflow?schema=public
          JWT_SECRET: ci-only-secret
          CLIENT_URL: http://localhost:5173

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:4000
